name: Migrate release signing configuration
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seal:
    if: github.ref == 'refs/heads/master' && github.actor == 'wildalley'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Seal existing values to this repository's release environment
        env:
          FERRY_KEYSTORE_BASE64: ${{ secrets.FERRY_KEYSTORE_BASE64 }}
          FERRY_KEYSTORE_PASSWORD: ${{ secrets.FERRY_KEYSTORE_PASSWORD }}
          FERRY_KEY_ALIAS: ${{ secrets.FERRY_KEY_ALIAS }}
          FERRY_KEY_PASSWORD: ${{ secrets.FERRY_KEY_PASSWORD }}
        run: |
          # Use the runner's libsodium. Only ciphertext leaves this process.
          python3 - <<'PYTHON'
          import base64, ctypes, ctypes.util, json, os
          from pathlib import Path
          key = base64.b64decode('McDZnAOc9j9RFyetXG7sSZU6tspV6yDvZ6iDVwRN8jE=', validate=True)
          assert len(key) == 32
          sodium = ctypes.CDLL(ctypes.util.find_library('sodium'))
          sodium.sodium_init.restype = ctypes.c_int
          assert sodium.sodium_init() >= 0
          sodium.crypto_box_seal.argtypes = [ctypes.c_void_p, ctypes.c_void_p, ctypes.c_ulonglong, ctypes.c_void_p]
          sodium.crypto_box_seal.restype = ctypes.c_int
          records = {}
          for name in ['FERRY_KEYSTORE_BASE64', 'FERRY_KEYSTORE_PASSWORD', 'FERRY_KEY_ALIAS', 'FERRY_KEY_PASSWORD']:
              value = os.environ[name].encode()
              if not value:
                  raise RuntimeError('Missing signing configuration: ' + name)
              encrypted = ctypes.create_string_buffer(len(value) + 48)
              assert sodium.crypto_box_seal(encrypted, value, len(value), key) == 0
              records[name] = {'key_id': '3380204578043523366', 'encrypted_value': base64.b64encode(encrypted.raw).decode()}
          Path('sealed-release-config.json').write_text(json.dumps(records))
          print('Sealed four values for the fixed release environment key.')
          PYTHON
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sealed-release-configuration
          path: sealed-release-config.json
          retention-days: 1
