<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#121D38"/>
      <stop offset="50%" stop-color="#080C1B"/>
      <stop offset="100%" stop-color="#04060E"/>
    </radialGradient>
    
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4" stop-opacity="0.6"/>
      <stop offset="35%" stop-color="#8B5CF6" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#3B82F6" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#00F5D4" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Core Ambient Lighting -->
    <radialGradient id="coreCyanGlow" cx="35%" cy="45%" r="40%">
      <stop offset="0%" stop-color="#00F5D4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00F5D4" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="coreVioletGlow" cx="65%" cy="55%" r="45%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>

    <!-- Ribbon Gradients -->
    <linearGradient id="streamCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="45%" stop-color="#00F5D4"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <linearGradient id="streamPurple" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <linearGradient id="streamBridge" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#00F5D4"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <linearGradient id="glassSheen" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <filter id="shadowBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="neonBloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- App Squircle Body -->
  <rect x="24" y="24" width="464" height="464" rx="112" ry="112" fill="url(#bgGlow)"/>
  <rect x="24" y="24" width="464" height="464" rx="112" ry="112" fill="none" stroke="url(#borderGlow)" stroke-width="2.5"/>

  <!-- Ambient Internal Lights -->
  <circle cx="200" cy="230" r="140" fill="url(#coreCyanGlow)"/>
  <circle cx="312" cy="282" r="150" fill="url(#coreVioletGlow)"/>

  <!-- Subtle Speed Vectors Grid in Background -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1.2">
    <line x1="90" y1="256" x2="422" y2="256" stroke-dasharray="4 8"/>
    <line x1="256" y1="90" x2="256" y2="422" stroke-dasharray="4 8"/>
    <circle cx="256" cy="256" r="160" fill="none" stroke-dasharray="2 12"/>
    <circle cx="256" cy="256" r="90" fill="none" stroke-dasharray="2 8"/>
  </g>

  <!-- Central Symbol: Aetheris Infinity Warp Gate -->
  <g filter="url(#shadowBlur)">
    <!-- Back Loop (Violet/Magenta Tunnel) -->
    <path d="M 256,256 C 290,205 345,170 400,195 C 455,220 455,300 405,335 C 355,370 295,330 256,256 Z"
          fill="none" stroke="url(#streamPurple)" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Neon Core line on Violet loop -->
    <path d="M 256,256 C 290,205 345,170 400,195 C 455,220 455,300 405,335 C 355,370 295,330 256,256 Z"
          fill="none" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="4" stroke-linecap="round"/>

    <!-- Front Loop (Cyan/Emerald Velocity Stream) -->
    <path d="M 256,256 C 215,310 165,345 110,320 C 55,295 55,215 105,180 C 160,140 215,185 256,256 Z"
          fill="none" stroke="url(#streamCyan)" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Dynamic Speed Accent Beads -->
    <circle cx="105" cy="180" r="8" fill="#FFFFFF" filter="url(#neonBloom)"/>
    <circle cx="405" cy="335" r="8" fill="#FFFFFF" filter="url(#neonBloom)"/>

    <!-- Center Warp Singularity -->
    <circle cx="256" cy="256" r="14" fill="#04060E" stroke="url(#streamBridge)" stroke-width="6"/>
    <circle cx="256" cy="256" r="5" fill="#00F5D4"/>
  </g>

  <!-- Glassmorphic Gloss Overlay -->
  <path d="M 40,140 C 40,80 80,40 140,40 L 372,40 C 432,40 472,80 472,140 C 472,210 310,230 200,280 C 90,330 40,240 40,140 Z"
        fill="url(#glassSheen)" opacity="0.35"/>
</svg>
