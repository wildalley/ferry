<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="lumBg" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#151D33"/>
      <stop offset="60%" stop-color="#080C1A"/>
      <stop offset="100%" stop-color="#03050B"/>
    </radialGradient>

    <linearGradient id="lumBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.6"/>
    </linearGradient>

    <linearGradient id="auroraWave1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>

    <linearGradient id="auroraWave2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="50%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>

    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="20%" stop-color="#A5F3FC"/>
      <stop offset="60%" stop-color="#0284C7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#080C1A" stop-opacity="0"/>
    </radialGradient>

    <filter id="lumShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="112" ry="112" fill="url(#lumBg)"/>
  <rect x="24" y="24" width="464" height="464" rx="112" ry="112" fill="none" stroke="url(#lumBorder)" stroke-width="2.5"/>

  <!-- Star ambient halo -->
  <circle cx="256" cy="256" r="160" fill="url(#starGlow)" opacity="0.3"/>

  <!-- Flowing dynamic curves -->
  <g filter="url(#lumShadow)">
    <!-- Lower Aurora Arc -->
    <path d="M 100,320 C 150,400 320,410 390,330 C 440,270 410,210 350,210 C 270,210 220,310 150,300 C 120,295 105,310 100,320 Z"
          fill="url(#auroraWave2)" opacity="0.85"/>

    <!-- Upper Aurora Arc -->
    <path d="M 412,192 C 362,112 192,102 122,182 C 72,242 102,302 162,302 C 242,302 292,202 362,212 C 392,217 407,202 412,192 Z"
          fill="url(#auroraWave1)" opacity="0.95"/>

    <!-- Quantum Singularity Star -->
    <path d="M 256,160 Q 256,256 160,256 Q 256,256 256,352 Q 256,256 352,256 Q 256,256 256,160 Z"
          fill="#FFFFFF" />
    <circle cx="256" cy="256" r="8" fill="#00F5D4"/>
  </g>
</svg>
